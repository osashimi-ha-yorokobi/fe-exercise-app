<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">サービスレベル指標</title><desc id="desc">指標は実測する数値、目標は達成したい数値。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="26" y="63" width="324" height="168" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="188" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">指標</text><line x1="63" y1="141" x2="313" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="188" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">実際の応答時間</text><rect x="370" y="63" width="324" height="168" rx="18" fill="#fff2e7" stroke="#efb982" stroke-width="2"/><text x="532" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">目標</text><line x1="407" y1="141" x2="657" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="532" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">何秒以内か</text></svg>
