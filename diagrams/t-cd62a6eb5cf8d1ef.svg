<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">カーボンニュートラル</title><desc id="desc">排出を減らした上で、残る排出量と吸収・除去量を差し引き実質ゼロにする。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="26" y="63" width="324" height="168" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="188" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">残る排出量</text><line x1="63" y1="141" x2="313" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="188" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">温室効果ガス</text><rect x="370" y="63" width="324" height="168" rx="18" fill="#fff2e7" stroke="#efb982" stroke-width="2"/><text x="532" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">吸収・除去量</text><line x1="407" y1="141" x2="657" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="532" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">差し引きゼロ</text></svg>
