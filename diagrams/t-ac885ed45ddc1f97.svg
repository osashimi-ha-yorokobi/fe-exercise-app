<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">クロス集計表</title><desc id="desc">学年と部活動のように、二つの分類を組み合わせて人数を数える。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="40" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><rect x="253.33333333333334" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">部活あり</text><rect x="466.6666666666667" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">部活なし</text><rect x="40" y="100" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">1年</text><rect x="253.33333333333334" y="100" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">18人</text><rect x="466.6666666666667" y="100" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">12人</text><rect x="40" y="150" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">2年</text><rect x="253.33333333333334" y="150" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">20人</text><rect x="466.6666666666667" y="150" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">10人</text></svg>
