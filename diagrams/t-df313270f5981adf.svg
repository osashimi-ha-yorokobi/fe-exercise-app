<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">拡散モデル</title><desc id="desc">学習時は画像にノイズを加え、生成時はノイズを少しずつ取り除く。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="28" y="76" width="152.5" height="125" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="104.25" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">元の画像</text><text x="189.5" y="149" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#39866b">→</text><rect x="198.5" y="76" width="152.5" height="125" rx="18" fill="#eef2ff" stroke="#a6b7e8" stroke-width="2"/><text x="274.75" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">ノイズを学ぶ</text><text x="360" y="149" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#39866b">→</text><rect x="369" y="76" width="152.5" height="125" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="445.25" y="131.875" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">ノイズから開</text><text x="445.25" y="158.125" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">始</text><text x="530.5" y="149" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#39866b">→</text><rect x="539.5" y="76" width="152.5" height="125" rx="18" fill="#eef2ff" stroke="#a6b7e8" stroke-width="2"/><text x="615.75" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">新しい画像</text></svg>
