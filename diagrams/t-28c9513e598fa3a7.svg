<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">加法混色</title><desc id="desc">光の赤・緑・青を重ねると、明るくなり、三色を重ねると白になる。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="35" y="75" width="135" height="105" rx="16" fill="#f05050" stroke="#f05050" stroke-width="2"/><text x="102" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">赤の光</text><text x="181" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="25" font-weight="700" fill="#587b70">＋</text><rect x="195" y="75" width="135" height="105" rx="16" fill="#45bd70" stroke="#45bd70" stroke-width="2"/><text x="262" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">緑の光</text><text x="341" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="25" font-weight="700" fill="#587b70">＋</text><rect x="355" y="75" width="135" height="105" rx="16" fill="#5489e9" stroke="#5489e9" stroke-width="2"/><text x="422" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">青の光</text><text x="536" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="31" font-weight="700" fill="#587b70">→</text><rect x="581" y="76" width="100" height="104" rx="16" fill="#fff" stroke="#becdc3" stroke-width="2"/><text x="632" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">白</text></svg>
