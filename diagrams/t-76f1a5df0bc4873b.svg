<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">サービスブループリント</title><desc id="desc">客の行動と、その裏で働く人や仕組みを対応させる。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="40" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">段階</text><rect x="253.33333333333334" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">客</text><rect x="466.6666666666667" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">裏側</text><rect x="40" y="100" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">注文</text><rect x="253.33333333333334" y="100" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">入力する</text><rect x="466.6666666666667" y="100" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">受付処理</text><rect x="40" y="150" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">受取</text><rect x="253.33333333333334" y="150" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">商品を受ける</text><rect x="466.6666666666667" y="150" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">配送する</text></svg>
