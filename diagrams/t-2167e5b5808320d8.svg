<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">箱ひげ図</title><desc id="desc">箱は中央の半分、中央線は中央値、両端は値の広がりを示す。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><line x1="70" y1="228" x2="665" y2="228" stroke="#587b70" stroke-width="2"/><line x1="70" y1="228" x2="70" y2="52" stroke="#587b70" stroke-width="2"/><line x1="112" y1="140" x2="603" y2="140" stroke="#347f6b" stroke-width="4"/><line x1="112" y1="120" x2="112" y2="160" stroke="#347f6b" stroke-width="3"/><line x1="603" y1="120" x2="603" y2="160" stroke="#347f6b" stroke-width="3"/><rect x="230" y="105" width="260" height="70" rx="3" fill="#e7f5ed" stroke="#347f6b" stroke-width="2"/><line x1="357" y1="105" x2="357" y2="175" stroke="#d67850" stroke-width="4"/><text x="112" y="205" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#153b34">最小</text><text x="230" y="205" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#153b34">25%</text><text x="357" y="205" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#153b34">中央</text><text x="490" y="205" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#153b34">75%</text><text x="603" y="205" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#153b34">最大</text></svg>
