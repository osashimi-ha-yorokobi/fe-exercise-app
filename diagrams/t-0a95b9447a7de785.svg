<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">デンドログラム</title><desc id="desc">近いもの同士が低い位置でまとまり、離れた集まりが高い位置でつながる。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><text x="140" y="242" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#153b34">A</text><text x="270" y="242" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#153b34">B</text><text x="450" y="242" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#153b34">C</text><text x="580" y="242" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#153b34">D</text><line x1="140" y1="220" x2="140" y2="168" stroke="#39866b" stroke-width="3"/><line x1="270" y1="220" x2="270" y2="168" stroke="#39866b" stroke-width="3"/><line x1="140" y1="168" x2="270" y2="168" stroke="#39866b" stroke-width="3"/><line x1="450" y1="220" x2="450" y2="144" stroke="#39866b" stroke-width="3"/><line x1="580" y1="220" x2="580" y2="144" stroke="#39866b" stroke-width="3"/><line x1="450" y1="144" x2="580" y2="144" stroke="#39866b" stroke-width="3"/><line x1="205" y1="168" x2="205" y2="69" stroke="#39866b" stroke-width="3"/><line x1="515" y1="144" x2="515" y2="69" stroke="#39866b" stroke-width="3"/><line x1="205" y1="69" x2="515" y2="69" stroke="#39866b" stroke-width="3"/><text x="360" y="47" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">離れた集まりが最後につながる</text></svg>
