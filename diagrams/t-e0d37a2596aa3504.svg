<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">コントラスト</title><desc id="desc">明るい部分と暗い部分の差が、見えやすさを左右する。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="26" y="63" width="324" height="168" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="188" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">差が小さい</text><line x1="63" y1="141" x2="313" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="188" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">文字が読みにくい</text><rect x="370" y="63" width="324" height="168" rx="18" fill="#fff2e7" stroke="#efb982" stroke-width="2"/><text x="532" y="119" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#153b34">差が大きい</text><line x1="407" y1="141" x2="657" y2="141" stroke="#cbd9d1" stroke-width="2"/><text x="532" y="186" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#405851">文字が読みやすい</text></svg>
