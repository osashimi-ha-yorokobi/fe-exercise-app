<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">減法混色</title><desc id="desc">色材のシアン・マゼンタ・イエローを重ねると、暗くなる。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="35" y="75" width="135" height="105" rx="16" fill="#30c5ca" stroke="#30c5ca" stroke-width="2"/><text x="102" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">シアン</text><text x="181" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="25" font-weight="700" fill="#587b70">＋</text><rect x="195" y="75" width="135" height="105" rx="16" fill="#d969ba" stroke="#d969ba" stroke-width="2"/><text x="262" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">マゼンタ</text><text x="341" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="25" font-weight="700" fill="#587b70">＋</text><rect x="355" y="75" width="135" height="105" rx="16" fill="#e7cb3e" stroke="#e7cb3e" stroke-width="2"/><text x="422" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">イエロー</text><text x="536" y="140" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="31" font-weight="700" fill="#587b70">→</text><rect x="581" y="76" width="100" height="104" rx="16" fill="#263b38" stroke="#263b38" stroke-width="2"/><text x="632" y="209" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#405851">暗い色</text></svg>
