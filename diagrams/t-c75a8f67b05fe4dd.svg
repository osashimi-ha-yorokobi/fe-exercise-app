<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">第1種の誤り</title><desc id="desc">本当は差がないのに、差があると判断するのが第1種の誤り。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="40" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><rect x="253.33333333333334" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">差があると判断</text><rect x="466.6666666666667" y="50" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="81" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">差がないと判断</text><rect x="40" y="100" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">本当は差なし</text><rect x="253.33333333333334" y="100" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">第1種の誤り</text><rect x="466.6666666666667" y="100" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="131" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">正しい</text><rect x="40" y="150" width="209.33333333333334" height="46" rx="7" fill="#dcefe5" stroke="#d4e3d8" stroke-width="2"/><text x="144.66666666666669" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">本当は差あり</text><rect x="253.33333333333334" y="150" width="209.33333333333334" height="46" rx="7" fill="#f2f5ff" stroke="#d4e3d8" stroke-width="2"/><text x="358" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">正しい</text><rect x="466.6666666666667" y="150" width="209.33333333333334" height="46" rx="7" fill="#fff4e9" stroke="#d4e3d8" stroke-width="2"/><text x="571.3333333333334" y="181" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="#153b34">第2種の誤り</text></svg>
