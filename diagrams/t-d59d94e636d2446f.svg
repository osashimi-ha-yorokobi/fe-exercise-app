<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">コンジョイント分析</title><desc id="desc">価格や機能を組み合わせて見せ、何が選択に効くかを調べる。</desc><rect width="720" height="280" rx="20" fill="#fbfdfa"/><rect x="1" y="1" width="718" height="278" rx="19" fill="none" stroke="#d6e6d9"/><rect x="28" y="76" width="209.33333333333334" height="125" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="132.66666666666669" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">条件を組合せる</text><text x="246.33333333333334" y="149" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#39866b">→</text><rect x="255.33333333333334" y="76" width="209.33333333333334" height="125" rx="18" fill="#eef2ff" stroke="#a6b7e8" stroke-width="2"/><text x="360" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">どれを選ぶか聞く</text><text x="473.6666666666667" y="149" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700" fill="#39866b">→</text><rect x="482.6666666666667" y="76" width="209.33333333333334" height="125" rx="18" fill="#e7f5ed" stroke="#8cc8a7" stroke-width="2"/><text x="587.3333333333334" y="145" text-anchor="middle" font-family="Arial, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#153b34">重視点を分析</text></svg>
