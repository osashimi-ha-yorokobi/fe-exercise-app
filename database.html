<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>単語帳データベース | FE ことばノート</title>
  <style>
    :root{font-family:system-ui,"Hiragino Sans",Meiryo,sans-serif;color:#20342d;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:24px 16px 60px}h1{font-size:25px;margin:10px 0}p{line-height:1.6}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a,.downloads a{color:#0b7060;font-weight:700}.downloads{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.downloads a{border:1px solid #b8d6c5;background:white;border-radius:10px;padding:9px 12px;text-decoration:none}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:20px 0 12px}input,select{width:100%;min-height:46px;border:1px solid #c6d9cb;border-radius:10px;background:white;padding:8px 12px;font:inherit;font-size:15px}.status{font-size:13px;color:#577465}.row{background:white;border:1px solid #dae7dc;border-radius:14px;padding:15px;margin:10px 0}.row h2{font-size:17px;margin:0 0 5px}.meta{font-size:12px;color:#61776a}.description{font-size:16px;line-height:1.75;margin:11px 0;color:#172d27;font-weight:600}.missing{color:#8b5b50}.added-tag{display:inline-block;vertical-align:middle;border-radius:999px;background:#e6f3e9;color:#145b45;font-size:11px;font-weight:700;padding:3px 7px;white-space:nowrap}.more{width:100%;min-height:46px;border:1px solid #a6c9b4;border-radius:10px;background:white;color:#0b7060;font-weight:700}@media(max-width:560px){.filters{grid-template-columns:1fr}}
    .description{white-space:pre-line;overflow-wrap:anywhere}
  </style>
  <script src="./data/terms.js" defer></script>
  <script src="./data/descriptions.js" defer></script>
  <script src="./js/database.js" defer></script>
</head>
<body><main>
  <div class="top"><h1>単語帳データ</h1><a href="./index.html">単語帳に戻る →</a></div>
  <p>収録した用語、ジャンル、説明を検索できます。Ver.9.0以降の追加語も絞り込めます。</p>
  <div class="downloads"><a href="./data/vocabulary.csv" download>CSVを保存・編集する</a><a href="./sources.html">参照資料・収録方針</a></div>
  <div class="filters"><input id="query" type="search" placeholder="用語・読み・英語・説明を検索" aria-label="用語を検索"><select id="category" aria-label="ジャンルを選択"><option value="">全ジャンル</option></select><select id="version" aria-label="追加されたシラバスの版"><option value="">すべての版</option><option value="9.0">Ver.9.0追加</option><option value="9.1">Ver.9.1追加</option><option value="9.2">Ver.9.2追加</option></select></div>
  <p id="status" class="status" role="status"></p><div id="results"></div><button id="more" class="more" type="button" hidden>さらに表示</button>
</main></body></html>
